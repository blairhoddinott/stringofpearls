name: local-release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-release
  cancel-in-progress: false

jobs:
  release:
    name: Release automation
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' &&
      github.run_attempt == 1 &&
      github.repository == 'blairhoddinott/stringofpearls' &&
      github.actor == 'blairhoddinott' &&
      github.triggering_actor == 'blairhoddinott'
    runs-on: [self-hosted, linux, x64, stringofpearls-release]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner toolchain
        run: |
          node --version
          npm --version
          git --version
          gpg --version

      - name: Run release automation
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          GIT_AUTHOR_NAME: String of Pearls release automation
          GIT_AUTHOR_EMAIL: blair.hoddinott@gmail.com
          GIT_COMMITTER_NAME: String of Pearls release automation
          GIT_COMMITTER_EMAIL: blair.hoddinott@gmail.com
        run: node tools/release/lifecycle-cli.js
