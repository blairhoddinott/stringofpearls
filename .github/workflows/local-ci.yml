name: local-ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-checks:
    name: Branch checks
    if: >-
      github.actor == 'blairhoddinott' &&
      github.triggering_actor == 'blairhoddinott' &&
      github.event_name == 'push' &&
      github.ref != 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, stringofpearls-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner toolchain
        run: |
          node --version
          npm --version
          docker version
          docker compose version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate GitHub Actions workflows
        run: actionlint -color

      - name: Validate Dockerfiles
        run: |
          docker build --check .
          docker build --check --file infrastructure/github-runner/Dockerfile infrastructure/github-runner

      - name: Check formatting and whitespace
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${AFTER_SHA}^" "${AFTER_SHA}"
          else
            git diff --check "${BEFORE_SHA}" "${AFTER_SHA}"
          fi

      - name: Lint source
        run: npm run lint

      - name: Check strict contracts
        run: npm run typecheck:contracts

      - name: Verify deterministic build
        run: npm run build:test

  master-checks:
    name: Master acceptance
    if: >-
      github.actor == 'blairhoddinott' &&
      github.triggering_actor == 'blairhoddinott' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, stringofpearls-ci]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner toolchain
        run: |
          node --version
          npm --version
          docker version
          docker compose version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate GitHub Actions workflows
        run: actionlint -color

      - name: Validate Dockerfiles
        run: |
          docker build --check .
          docker build --check --file infrastructure/github-runner/Dockerfile infrastructure/github-runner

      - name: Run unit tests and coverage contract
        run: npm run test:coverage

      - name: Lint source
        run: npm run lint

      - name: Check strict contracts
        run: npm run typecheck:contracts

      - name: Prove core services are browser-free
        run: npm run core:browser-free

      - name: Validate aviation assets
        run: npm run validator:test && npm run validate:assets

      - name: Verify deterministic build
        run: npm run build:test

      - name: Test production server
        run: npm run server:test

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Smoke-test production container
        run: npm run docker:smoke

      - name: Run browser acceptance
        run: npm run browser:smoke
