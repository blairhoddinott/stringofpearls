name: local-ci

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

concurrency:
  group: local-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-checks:
    name: Branch checks
    if: >-
      github.actor == 'blairhoddinott' &&
      github.triggering_actor == 'blairhoddinott'
    runs-on: [self-hosted, linux, x64, stringofpearls-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner toolchain
        run: |
          node --version
          npm --version
          docker version
          docker compose version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate GitHub Actions workflows
        run: actionlint -color

      - name: Validate local CI policy
        run: node tools/ci/validate-local-workflow-policy.js

      - name: Validate Dockerfiles
        run: |
          docker build --check .
          docker build --check --file infrastructure/github-runner/Dockerfile infrastructure/github-runner

      - name: Check formatting and whitespace
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${AFTER_SHA}^" "${AFTER_SHA}"
          else
            git diff --check "${BEFORE_SHA}" "${AFTER_SHA}"
          fi

      - name: Lint source
        run: npm run lint

      - name: Check strict contracts
        run: npm run typecheck:contracts

      - name: Test schedule data contracts
        run: npm run schedule:test

      - name: Verify deterministic build
        run: npm run build:test
